trigger:
  branches:
    include:
      - main

pr: none

pool:

  name: 'Default'

variables:
  terraformVersion: '1.15.8'
  name: Default

variables:
  # NOTE: pick a real, existing Terraform version.
  # Check https://releases.hashicorp.com/terraform/ for the latest,
  # or just use 'latest' - TerraformInstaller@1 supports it.
  terraformVersion: 'latest'
  azureServiceConnection: 'vikas'

stages:

# ============================================================
# STAGE 1 - PREPROD
# ============================================================

- stage: PreProd
  displayName: 'Terraform PreProd'

  jobs:

  - job: Terraform_PreProd
    displayName: 'Terraform PreProd Plan & Apply'

    steps:

    # --------------------------------------------------------
    # Terraform Installation
    # --------------------------------------------------------
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    # Optional sanity check - now correctly AFTER install,
    # and using the tool via PATH instead of a hardcoded path.
    - task: CmdLine@2
      displayName: 'Verify Terraform Install'
      inputs:
        script: |
          echo Testing Terraform
          where terraform
          terraform version

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init - PreProd'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)Enviroment/preprod'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'b18g35-common-rg'
        backendAzureRmStorageAccountName: 'b18g35storageaccount2'
        backendAzureRmContainerName: 'vkcontainer'
        backendAzureRmKey: 'vikasADOPreProd.tfstate'

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Validate - PreProd'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)Enviroment/preprod'

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Plan - PreProd'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment/preprod'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-var-file="terraform.tfvars" -out=tfplan'

    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Apply - PreProd'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment/preprod'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: 'tfplan'


# ============================================================
# STAGE 2 - PROD
# ============================================================

- stage: Prod
  displayName: 'Terraform Production'

  dependsOn: PreProd
  condition: succeeded()

  jobs:

  - deployment: Terraform_Prod
    displayName: 'Terraform Prod Plan & Apply'

    # Attach approvals/checks to this environment in
    # Pipelines -> Environments -> terraform-prod -> Approvals and checks
    environment: 'terraform-prod'

    strategy:
      runOnce:
        deploy:

          steps:

          # --------------------------------------------------
          # Terraform Installation
          # --------------------------------------------------
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # --------------------------------------------------
          # Terraform Init
          # --------------------------------------------------
          - task: TerraformTask@5
            displayName: 'Terraform Init - Prod'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment/prod'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'b18g35-common-rg'
              backendAzureRmStorageAccountName: 'b18g35storageaccount2'
              backendAzureRmContainerName: 'vkcontainer'
              backendAzureRmKey: 'vikasADOprod.tfstate'


          # --------------------------------------------------
          # Terraform Validate
          # --------------------------------------------------
          - task: TerraformTask@5
            displayName: 'Terraform Validate - Prod'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment/prod'

          # --------------------------------------------------
          # Terraform Plan
          # --------------------------------------------------
          - task: TerraformTask@5
            displayName: 'Terraform Plan - Prod'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment/prod'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-var-file="terraform.tfvars" -out=tfplan'

          # --------------------------------------------------
          # Terraform Apply
          # --------------------------------------------------
          - task: TerraformTask@5
            displayName: 'Terraform Apply - Prod'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment/prod'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: 'tfplan'